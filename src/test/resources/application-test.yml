game:
  rules:
    probability:
      # Self-contained copy so the test suite never depends on a live Config Server; also demonstrates the
      # "profile config overrides the Config Server" requirement (game-scoring-config-client capability).
      # Same namespace timeline-service reads (shared-configuration-server capability) — game-service's
      # ScoringRulesProperties binds only the fields it declares below.
      push-shift:
        I: 10
        II: 20
        III: 30
      suppress-shift:
        I: -10
        II: -20
        III: -30
      swing-shift:
        I: 15
        II: 30
        III: 45
      band-low-max: 30
      band-medium-max: 60

spring:
  application:
    name: game-service
  datasource:
    url: jdbc:postgresql://localhost:5432/temporal_rift
    username: temporal_rift
    password: temporal_rift
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    properties:
      security.protocol: PLAINTEXT
    consumer:
      group-id: game-service
      auto-offset-reset: earliest
  modulith:
    events:
      externalization:
        enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
  cloud:
    stream:
      kafka:
        binder:
          brokers: ${spring.kafka.bootstrap-servers}
          configuration:
            security.protocol: PLAINTEXT

logging:
  level:
    io.github.temporalrift: DEBUG
    org.springframework.modulith: DEBUG
