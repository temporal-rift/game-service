game:
  rules:
    scoring:
      # Self-contained copy so the test suite never depends on a live Config Server; also demonstrates the
      # "profile config overrides the Config Server" requirement (game-scoring-config-client capability).
      card-shifts:
        PUSH: 20
        SUPPRESS: -20
        AMPLIFY: 0
        INTERCEPT: 0
        SCAN: 0
        TRACE: 0
        DECOY: 0
        JAM: 0
        STALL: 0
        REDIRECT: 0
        NULLIFY: 0
        COLLIDE: 0
        STABILIZE: 0
        DETONATE: 0
      swing-shift: 30
      low-max-probability: 30
      medium-max-probability: 60

spring:
  application:
    name: game-service
  datasource:
    url: jdbc:postgresql://localhost:5432/temporal_rift
    username: temporal_rift
    password: temporal_rift
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    properties:
      security.protocol: PLAINTEXT
    consumer:
      group-id: game-service
      auto-offset-reset: earliest
  modulith:
    events:
      externalization:
        enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
  cloud:
    stream:
      kafka:
        binder:
          brokers: ${spring.kafka.bootstrap-servers}
          configuration:
            security.protocol: PLAINTEXT

logging:
  level:
    io.github.temporalrift: DEBUG
    org.springframework.modulith: DEBUG
