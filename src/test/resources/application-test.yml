game:
  # Self-contained copy so the test suite never depends on a live Config Server; also demonstrates the
  # "profile config overrides the Config Server" requirement (game-scoring-config-client capability).
  rate-limit:
    requests-per-minute: 120
    cleanup-interval: 60s
  request-body-limit:
    max-bytes: 1048576
  timers:
    event-resubmit-min-age: 2m
    event-resubmit-interval: 30s
    action-round-sweep-interval: 1s
    hand-selection-sweep-interval: 1s
    reconnect-sweep-interval: 1s
    scoring-completion-sweep-interval: 1s
    era-saga-scores-updated-sweep-interval: 1s
  rules:
    min-players: 3
    max-players: 5
    max-eras: 5
    max-cascaded-paradoxes: 3
    events-per-era: 3
    cards-per-hand: 5
    cards-per-deal: 7
    win-score-threshold: 20
    reconnect-grace-period-seconds: 30
    action-round-timer-seconds:
      3: 60
      4: 45
      5: 30
    hand-selection-timer-seconds:
      3: 60
      4: 45
      5: 30
    card-category-weights:
      PROBABILITY_SHIFTER: 35
      INFORMATION: 25
      DISRUPTION: 25
      PARADOX: 15
    card-grade-weights:
      I: 60
      II: 30
      III: 10
    stabilization-winner-factions:
      - PROPHETS
      - WEAVERS
    once-era-budgeted-specials:
      - ANNIHILATE
      - SEAL
      - CORRUPT
      - MIMIC
    hand-deal-forced-types: []
    probability:
      # Same namespace timeline-service reads (shared-configuration-server capability) —
      # game-service's ScoringRulesProperties binds only the fields it declares below.
      push-shift:
        I: 10
        II: 20
        III: 30
      suppress-shift:
        I: -10
        II: -20
        III: -30
      swing-shift:
        I: 15
        II: 30
        III: 45
      band-low-max: 30
      band-medium-max: 60

spring:
  application:
    name: game-service
  datasource:
    url: jdbc:postgresql://localhost:5432/temporal_rift
    username: temporal_rift
    password: temporal_rift
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    properties:
      security.protocol: PLAINTEXT
    consumer:
      group-id: game-service
      auto-offset-reset: earliest
  modulith:
    events:
      externalization:
        enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
  cloud:
    stream:
      kafka:
        binder:
          brokers: ${spring.kafka.bootstrap-servers}
          configuration:
            security.protocol: PLAINTEXT

logging:
  level:
    io.github.temporalrift: DEBUG
    org.springframework.modulith: DEBUG
